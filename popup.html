<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>HISNet 알림</title>
  <style>
    body {
      font-family: sans-serif;
      width: 280px;
      margin: 0;
      padding: 14px;
      color: #222;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand-icon {
      width: 26px;
      height: 26px;
      border-radius: 50%;
    }
    .brand-title {
      font-size: 14px;
      font-weight: 600;
    }
    .icon-btn {
      width: 30px;
      height: 30px;
      padding: 0;
      border: 1px solid #ddd;
      border-radius: 6px;
      background: #fff;
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon-btn:hover {
      background: #f5f5f5;
    }
    .icon-btn.spinning {
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .subtitle {
      font-size: 12px;
      color: #888;
      margin: 6px 0 12px;
    }
    .subtitle.fail {
      color: #b00020;
    }
    #newPostsList {
      list-style: none;
      padding: 0;
      margin: 0;
      max-height: 220px;
      overflow-y: auto;
    }
    #newPostsList li {
      display: flex;
      gap: 8px;
      padding: 8px 0;
      border-top: 1px solid #eee;
    }
    #newPostsList li:first-child {
      border-top: none;
    }
    .unread-bar {
      width: 4px;
      border-radius: 2px;
      background: #0173bc;
      flex-shrink: 0;
    }
    #newPostsList a {
      display: block;
      font-size: 13px;
      line-height: 1.4;
      color: #222;
      text-decoration: none;
    }
    #newPostsList a:hover {
      text-decoration: underline;
    }
    .board-tag {
      display: block;
      font-size: 11px;
      color: #0173bc;
      margin-bottom: 2px;
    }
    .empty-state {
      font-size: 12px;
      color: #888;
      text-align: center;
      padding: 20px 0;
    }
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid #eee;
      font-size: 12px;
      color: #888;
    }
    .footer a {
      color: #0173bc;
      text-decoration: none;
    }
    .footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <img src="icons/icon48.png" class="brand-icon" alt="" />
      <span class="brand-title">HISNet</span>
    </div>
    <button id="refreshBtn" class="icon-btn" title="새로고침" aria-label="새로고침">⟳</button>
  </div>
  <p class="subtitle" id="subtitle">불러오는 중...</p>

  <ul id="newPostsList" hidden></ul>
  <p class="empty-state" id="emptyState" hidden>새 글이 없습니다.</p>

  <div class="footer">
    <span id="boardCount"></span>
    <a href="#" id="openOptionsLink">⚙ 설정</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
