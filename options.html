<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>HISNet 알림 설정</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 480px;
      margin: 32px auto;
      color: #222;
      background: #fafafa;
    }
    .page-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }
    .page-header img {
      width: 36px;
      height: 36px;
      border-radius: 10px;
    }
    .page-header h1 {
      font-size: 16px;
      font-weight: 600;
      margin: 0;
    }
    .page-header p {
      font-size: 12px;
      color: #888;
      margin: 2px 0 0;
    }
    .card {
      background: #fff;
      border: 1px solid #e5e5e5;
      border-radius: 12px;
      padding: 16px 18px;
      margin-bottom: 16px;
    }
    .card h2 {
      font-size: 13px;
      font-weight: 600;
      margin: 0 0 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    label {
      display: block;
      font-size: 12px;
      color: #555;
      margin-bottom: 4px;
    }
    input[type="text"],
    input[type="password"],
    input[type="number"] {
      width: 100%;
      box-sizing: border-box;
      padding: 7px 8px;
      margin-bottom: 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
    }
    button {
      cursor: pointer;
      border: 1px solid #ddd;
      border-radius: 6px;
      background: #fff;
      padding: 7px 12px;
      font-size: 13px;
    }
    button:hover {
      background: #f5f5f5;
    }
    #boardList {
      list-style: none;
      padding: 0;
      margin: 0 0 12px;
    }
    #boardList li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-top: 1px solid #eee;
      font-size: 13px;
      gap: 8px;
    }
    #boardList li:first-child {
      border-top: none;
    }
    .board-info {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .board-name {
      font-weight: 500;
    }
    .board-url {
      color: #999;
      font-size: 11px;
      display: block;
    }
    .icon-btn {
      width: 28px;
      height: 28px;
      padding: 0;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }
    .board-add-row {
      display: flex;
      gap: 6px;
    }
    .board-add-row input {
      flex: 1;
      margin-bottom: 0;
    }
    #saveBtn {
      width: 100%;
      padding: 10px;
      font-size: 14px;
      font-weight: 600;
      background: #0173bc;
      color: #fff;
      border: none;
    }
    #saveBtn:hover {
      background: #015d97;
    }
    #statusMsg {
      color: #1a7a1a;
      font-size: 12px;
      text-align: center;
      margin-top: 8px;
    }
    #testLoginResult {
      font-size: 12px;
      margin: 4px 0 0;
    }
    .warning-box {
      font-size: 11px;
      color: #7a4a00;
      background: #fff6e5;
      border: 1px solid #ffdd99;
      border-radius: 6px;
      padding: 8px 10px;
      margin-top: 10px;
      line-height: 1.5;
    }
    .hint {
      font-size: 11px;
      color: #999;
      margin: -4px 0 10px;
    }
  </style>
</head>
<body>
  <div class="page-header">
    <img src="icons/icon48.png" alt="" />
    <div>
      <h1>HISNet 알림 설정</h1>
      <p id="statusBox">불러오는 중...</p>
    </div>
  </div>

  <div class="card">
    <h2>👤 계정</h2>
    <label>아이디</label>
    <input type="text" id="loginId" autocomplete="off" />
    <label>비밀번호</label>
    <input type="password" id="loginPassword" autocomplete="off" />
    <button id="testLoginBtn">로그인 테스트</button>
    <p id="testLoginResult"></p>
    <div class="warning-box">
      ⚠️ 이 아이디/비밀번호는 <strong>암호화 없이 이 브라우저에만</strong> 저장됩니다
      (외부 서버로 전송되지 않고, HISNet 로그인 요청에만 사용됩니다). 브라우저 확장은
      구조상 진짜 암호화가 의미가 없어서(복호화 키를 결국 확장 코드 안에 같이 둬야
      함) 평문 저장 방식을 그대로 씁니다 — 이 컴퓨터 자체의 보안(잠금 화면, 다른
      사람과 계정 공유 여부 등)에 유의해주세요.
    </div>
  </div>

  <div class="card">
    <h2>⏱ 확인 주기</h2>
    <input type="number" id="intervalMinutes" min="15" step="1" />
    <p class="hint">최소 15분입니다 (학교 서버 부담 방지).</p>
  </div>

  <div class="card">
    <h2>📋 게시판 목록</h2>
    <ul id="boardList"></ul>
    <div class="board-add-row">
      <input type="text" id="newBoardName" placeholder="게시판 이름" />
      <input type="text" id="newBoardUrl" placeholder="게시판 URL" />
      <button id="addBoardBtn">추가</button>
    </div>
  </div>

  <button id="saveBtn">저장</button>
  <p id="statusMsg"></p>

  <script src="options.js"></script>
</body>
</html>
